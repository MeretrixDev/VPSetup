name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'setup.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'setup.sh'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Check bash syntax
        run: bash -n setup.sh

      - name: Run ShellCheck
        run: >
          shellcheck
          --severity=warning
          --exclude=SC2034,SC1091
          setup.sh
